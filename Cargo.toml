[package]
name = "mukoz"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[dependencies]
unicorn-engine = { version = "=2.1.1", default-features = false, features = ["arch_x86", "arch_arm", "arch_aarch64"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
anyhow = "1"
libc = "0.2"
mukoz-kernels = { path = "selfcheck/kernels" }
capstone = { version = "=0.14.0", optional = true }

[features]
# Disassembly in `show --disasm` (diagnostics only: verdicts never depend on it, docs/09 9.7).
default = ["disasm"]
disasm = ["dep:capstone"]

[profile.dev]
opt-level = 1

[profile.dev.package.unicorn-engine]
opt-level = 2

[dev-dependencies]
sha2 = "0.10"
