[package]
name = "mukoz"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Checks executable artifacts (binaries, machine-code routines) against written contracts and reports counterexamples and scope"
readme = "README.md"
rust-version = "1.97"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
anyhow = "1"
libc = "0.2"
mukoz-kernels = { path = "selfcheck/kernels" }
capstone = { version = "=0.14.0", optional = true }

[features]
# Disassembly in `show --disasm` (diagnostics only: verdicts never depend on it, docs/09 9.7).
default = ["disasm"]
disasm = ["dep:capstone"]

[workspace]
# mukoz-emu (emu/) is a separate program under GPL-2.0-or-later: it links Unicorn. mukoz runs it
# as a child process over the mukoz-emu/1 protocol and does not link it. mukoz-emu-icicle
# (emu-icicle/) implements the same protocol on icicle-emu (MIT OR Apache-2.0).
members = [".", "emu", "emu-icicle", "selfcheck/kernels"]
default-members = [".", "emu", "emu-icicle"]

[profile.dev]
opt-level = 1

[profile.dev.package.unicorn-engine]
opt-level = 2

[dev-dependencies]
sha2 = "0.10"
