schema = "mukoz.contract/1"
id = "selfcheck.cli"
boundary = "process"

# One row of the stage-2 table (gen.py): op (0 = expr check, 1 = inspect), expected exit code,
# whether the expected stdout is exact or a prefix, then the expected stdout, the expression
# text and the file contents.
[inputs]
row = { type = "bytes", max_len = 2048 }
op = "bv64"
code = "bv64"
exact = "bv64"
expected = { type = "bytes", max_len = 1024 }
text = { type = "bytes", max_len = 64 }
file = { type = "bytes", max_len = 256 }

[results]
status = "bv8"
out = { type = "bytes", max_len = 4096 }
err = { type = "bytes", max_len = 1024 }

[[requires]]
id = "row_from_table"
expr = "input.row == hex\"\" or input.row == hex\"\" or input.row == hex\"\" or input.row == hex\"\" or input.row == hex\"\" or input.row == hex\"\" or input.row == hex\"\" or input.row == hex\"\" or input.row == hex\"\" or input.row == hex\"\" or input.row == hex\"\""

[[requires]]
id = "fields_from_row"
expr = "input.op == u64le(input.row, bv64(0)) and input.code == u64le(input.row, bv64(8)) and input.exact == u64le(input.row, bv64(16)) and input.expected == slice(input.row, bv64(48), u64le(input.row, bv64(24))) and input.text == slice(input.row, bv64(48) + u64le(input.row, bv64(24)), u64le(input.row, bv64(32))) and input.file == slice(input.row, bv64(48) + u64le(input.row, bv64(24)) + u64le(input.row, bv64(32)), u64le(input.row, bv64(40)))"

[[ensures]]
id = "exit_code"
expr = "result.status == extract(input.code, 7, 0)"

[[ensures]]
id = "stdout"
expr = "ite(uge(len(result.out), len(input.expected)), slice(result.out, bv64(0), len(input.expected)) == input.expected and (input.exact == bv64(0) or len(result.out) == len(input.expected)), false)"

[effects]
allow = ["read", "write", "open", "close"]

[termination]
kind = "must_exit"
