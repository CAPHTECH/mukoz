schema = "mukoz.binding/1"
id = "selfcheck.copy_bytes@x86_64"
contract = "selfcheck.copy_bytes"
target = "x86_64/elf/sysv-x86_64/none"

[entry]
kind = "object_symbol"
symbol = "mk_copy_bytes"

[arguments]
rdi = "addr(dst)"
rsi = "addr(src)"
rdx = "len(input.src)"


[regions.dst]
size = "len(before.dst)"
init = "before.dst"
access = "rw"
observe_as = "after.dst"

[regions.src]
size = "len(input.src)"
init = "input.src"
access = "r"

[completion]
kind = "return_to_sentinel"
