schema = "mukoz.binding/1"
id = "mem.copy@aarch64-aapcs64"
contract = "mem.copy"
target = "aarch64/raw/aapcs64/none"

[entry]
kind = "raw_offset"
offset = 0

[arguments]
x0 = "addr(dst)"
x1 = "addr(src)"
x2 = "len(input.src)"

[regions.dst]
size = "len(before.dst)"
# When another module calls copy, dst's size is not in any register; the contract requires it to equal len(src).
monitor_size = "len(input.src)"
init = "before.dst"
access = "rw"
observe_as = "after.dst"

[regions.src]
size = "len(input.src)"
init = "input.src"
access = "r"

[completion]
kind = "return_to_sentinel"
