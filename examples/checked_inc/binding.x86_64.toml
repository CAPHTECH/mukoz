schema = "mukoz.binding/1"
id = "counter.checked_inc@x86_64-sysv"
contract = "counter.checked_inc"
target = "x86_64/raw/sysv-x86_64/none"

[entry]
kind = "raw_offset"
offset = 0

[arguments]
rdi = "addr(counter)"
