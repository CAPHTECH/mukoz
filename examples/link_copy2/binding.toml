schema = "mukoz.binding/1"
id = "mem.copy_twice@x86_64-sysv"
contract = "mem.copy_twice"
target = "x86_64/raw/sysv-x86_64/none"
link = "link.toml"

[entry]
kind = "symbol"
symbol = "main.copy_twice"

[arguments]
rdi = "addr(dst)"
rsi = "addr(src)"
rdx = "len(input.src)"

[regions.dst]
size = "len(before.dst)"
init = "before.dst"
access = "rw"
observe_as = "after.dst"

[regions.src]
size = "len(input.src)"
init = "input.src"
access = "r"

[completion]
kind = "return_to_sentinel"
