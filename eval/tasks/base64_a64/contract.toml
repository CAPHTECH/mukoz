expr = "forall g in bv64(0)..udiv(len(input.src) + bv64(2), bv64(3)): after.dst[(g + g + g + g)] == ite(ult(lshr(input.src[(g + g + g)], bv8(2)), bv8(26)), lshr(input.src[(g + g + g)], bv8(2)) + bv8(65), ite(ult(lshr(input.src[(g + g + g)], bv8(2)), bv8(52)), lshr(input.src[(g + g + g)], bv8(2)) + bv8(71), ite(ult(lshr(input.src[(g + g + g)], bv8(2)), bv8(62)), lshr(input.src[(g + g + g)], bv8(2)) - bv8(4), ite(lshr(input.src[(g + g + g)], bv8(2)) == bv8(62), bv8(43), bv8(47)))))"

