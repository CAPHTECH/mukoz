[[ensures]]
id = "char3"
expr = "forall g in bv64(0)..udiv(len(input.src) + bv64(2), bv64(3)): after.dst[(g + g + g + g) + bv64(3)] == ite(ult((g + g + g) + bv64(2), len(input.src)), ite(ult((ite(ult((g + g + g) + bv64(2), len(input.src)), input.src[(g + g + g) + bv64(2)], bv8(0)) & bv8(63)), bv8(26)), (ite(ult((g + g + g) + bv64(2), len(input.src)), input.src[(g + g + g) + bv64(2)], bv8(0)) & bv8(63)) + bv8(65), ite(ult((ite(ult((g + g + g) + bv64(2), len(input.src)), input.src[(g + g + g) + bv64(2)], bv8(0)) & bv8(63)), bv8(52)), (ite(ult((g + g + g) + bv64(2), len(input.src)), input.src[(g + g + g) + bv64(2)], bv8(0)) & bv8(63)) + bv8(71), ite(ult((ite(ult((g + g + g) + bv64(2), len(input.src)), input.src[(g + g + g) + bv64(2)], bv8(0)) & bv8(63)), bv8(62)), (ite(ult((g + g + g) + bv64(2), len(input.src)), input.src[(g + g + g) + bv64(2)], bv8(0)) & bv8(63)) - bv8(4), ite((ite(ult((g + g + g) + bv64(2), len(input.src)), input.src[(g + g + g) + bv64(2)], bv8(0)) & bv8(63)) == bv8(62), bv8(43), bv8(47))))), bv8(61))"

