schema = "mukoz.contract/1"
id = "task.abs_diff"
boundary = "routine"

[inputs]
a = "bv64"
b = "bv64"

[results]
value = "bv64"

[[ensures]]
id = "value"
expr = "result.value == ite(uge(input.a, input.b), input.a - input.b, input.b - input.a)"

[effects]
allow = []

[termination]
kind = "must_return"
