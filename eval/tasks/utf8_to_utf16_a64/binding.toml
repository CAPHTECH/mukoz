schema = "mukoz.binding/1"
id = "task.utf8_to_utf16@aarch64-aapcs64"
contract = "task.utf8_to_utf16"
target = "aarch64/raw/aapcs64/none"

[entry]
kind = "raw_offset"
offset = 0

[arguments]
x0 = "addr(dst)"
x1 = "addr(src)"
x2 = "len(input.src)"

[results]
value = "x0"

[regions.dst]
size = "len(before.dst)"
init = "before.dst"
access = "rw"
observe_as = "after.dst"

[regions.src]
size = "len(input.src)"
init = "input.src"
access = "r"

[completion]
kind = "return_to_sentinel"
