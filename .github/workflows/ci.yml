name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  default:
    name: Tests and Tier 1 (icicle-emu, the default)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The native executors run subjects in unprivileged user namespaces; Ubuntu 24.04 restricts
      # them through AppArmor by default.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked
      - name: Tier 1 acceptance criteria
        run: python3 tools/tier1.py
      - name: Upload the Tier 1 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-report
          path: target/tier1-report.json
          if-no-files-found: ignore

  unicorn:
    name: Tests with the optional Unicorn emulator
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: Swatinem/rust-cache@v2
      - name: Build (mukoz-emu needs CMake, preinstalled on the runner)
        run: |
          cargo build --release --locked
          cargo build --release --locked -p mukoz-emu
      - name: Test
        run: MUKOZ_EMU="$PWD/target/release/mukoz-emu" cargo test --release --locked --workspace --exclude mukoz-kernels
